# Ontology YAML for Query Understanding & Routing (Contract v1.0)
# Project: Vulnerability Knowledge & Query Understanding
# Maintainer: Long (Query Understanding Lead)
# Standard Slugs: xss, sqli, bac, auth_failures, misconfig
# Rule: Missing data must be [] rather than omitted.
# Note:
#   - Aliases must not contain short/ambiguous terms like "bac" (Contract v1.0 L7).
#   - Aliases must not collide across different entries (case-insensitive).
#   - Related terms represent defenses/concepts and must not be treated as aliases.

